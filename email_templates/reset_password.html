<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password Email Template</title>
    <meta name="description" content="Reset Password Email Template." />
  </head>
  <body>
    <table cellspacing="0" border="0" cellpadding="0" width="100%">
      <tr>
        <td>
          <table cellspacing="0" border="0" cellpadding="0" width="100%">
            <tr>
              <td>
                <table width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="background-color: #f2f3f8; padding: 20px">
                      <!-- Envelope Border -->
                      <table
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        style="
                          border: 1px solid #cecece;
                          background: #fff;
                          border-radius: 5px;
                          padding: 20px;
                          margin: 0 auto;
                        "
                      >
                        <tr>
                          <td>
                            <h1
                              style="
                                color: #1e1e2d;
                                font-weight: 500;
                                margin: 0;
                                font-size: 32px;
                                font-family: 'Rubik', sans-serif;
                                text-align: center;
                                margin-bottom: 20px;
                              "
                            >
                              You have requested to reset your password
                            </h1>
                            <span
                              style="
                                display: block;
                                margin: 0 auto;
                                border-bottom: 1px solid #cecece;
                                width: 100px;
                                margin-bottom: 20px;
                              "
                            ></span>
                            <p
                              style="
                                color: #455056;
                                font-size: 15px;
                                line-height: 24px;
                                margin: 0;
                                text-align: center;
                                margin-bottom: 20px;
                              "
                            >
                              We cannot simply send you your old password. A
                              unique link to reset your password has been
                              generated for you. To reset your password, click
                              the following link and follow the instructions.
                              This link is available for 15 minutes.
                            </p>
                            <a
                              href="{{resetLink}}"
                              style="
                                background: #20e277;
                                text-decoration: none !important;
                                font-weight: 500;
                                margin-top: 35px;
                                color: #fff;
                                text-transform: uppercase;
                                font-size: 14px;
                                padding: 10px 24px;
                                display: block;
                                border-radius: 5px;
                                text-align: center;
                                width: 200px;
                                margin: 0 auto;
                              "
                              >Reset Password</a
                            >
                          </td>
                        </tr>
                      </table>
                      <!-- End of Envelope Border -->
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
